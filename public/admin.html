<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do Casal | Daniel & Nubia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"></head><body class="admin"><main><section id="loginView" class="login-shell"><div class="login-card"><div class="lock">⌂</div><p class="eyebrow">ÁREA PRIVADA</p><h1>Daniel & Nubia</h1><p>Entre para gerenciar a lista e ver quem escolheu cada presente.</p><form id="loginForm"><input name="user" placeholder="Usuário" required><input type="password" name="password" placeholder="Senha" required><button>Entrar</button><p id="loginFeedback"></p></form><a href="/">← Voltar ao site</a></div></section><section id="dashView" hidden><header><div><p class="eyebrow">CHÁ DE CASA NOVA</p><h1>Painel do Casal</h1></div><div><a href="/" target="_blank">Ver site</a><button id="logout">Sair</button></div></header><div class="stats" id="stats"></div><div class="tabs"><button class="active" data-tab="reservas">Reservas</button><button data-tab="presentes">Presentes</button><button data-tab="mensagens">Mensagens</button></div><section class="panel" id="reservas"></section><section class="panel" id="presentes" hidden><div class="panel-head"><h2>Gerenciar presentes</h2><button id="newGift">+ Novo presente</button></div><div id="giftAdminList"></div></section><section class="panel" id="mensagens" hidden></section></section></main><dialog id="giftDialog"><form id="giftForm"><input type="hidden" name="id"><div class="dialog-head"><h2 id="giftDialogTitle">Novo presente</h2><button type="button" id="closeDialog">×</button></div><label>Nome<input name="name" required></label><label>Categoria<select name="category"><option>Cozinha</option><option>Sala</option><option>Quarto</option><option>Banheiro</option><option>Limpeza</option><option>Eletrodomésticos</option><option>Outros</option></select></label><label>Descrição<textarea name="description"></textarea></label><div class="two"><label>Quantidade<input type="number" min="1" max="99" name="quantity" value="1"></label><label>Ícone<select name="image"><option value="presente">Presente</option><option value="airfryer">Air Fryer</option><option value="panelas">Panelas</option><option value="toalhas">Toalhas</option><option value="aspirador">Limpeza</option><option value="pratos">Pratos</option><option value="cafeteira">Cafeteira</option><option value="cama">Cama</option><option value="microondas">Micro-ondas</option><option value="faqueiro">Faqueiro</option><option value="copos">Copos</option><option value="edredom">Edredom</option><option value="liquidificador">Liquidificador</option></select></label></div><button class="save" type="submit">Salvar presente</button><p id="giftFeedback"></p></form></dialog><script src="/admin.js"></script></body></html>
